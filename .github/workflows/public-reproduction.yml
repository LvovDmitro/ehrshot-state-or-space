name: Public aggregate reproduction
on: [push, pull_request, workflow_dispatch]
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-public.txt
      - run: python -m pytest -q
      - run: python paper/reproduce_public.py
